<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Sensitivity Analysis</title>
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8982708382636496"
         crossorigin="anonymous"></script>
    
    <!-- Load Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        /* Custom styles for the application */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6; /* bg-gray-100 */
        }

        /* Style for the sticky table headers */
        #table-container {
            max-height: 85vh; /* Limit height to enable vertical scrolling */
            overflow: auto;    /* Enable scrolling */
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        #sensitivity-table th {
            position: sticky;
            background-color: #f1f5f9; /* Light gray background for headers */
            z-index: 10;
            font-weight: 600;
        }

        /* Header row (Interest Rates) */
        #sensitivity-table thead th {
            top: 0;
        }

        /* Header column (Home Price) */
        #sensitivity-table tbody th {
            left: 0;
            z-index: 20; /* Must be above other cells */
        }

        /* Top-left corner cell */
        #sensitivity-table thead th:first-child {
            top: 0;
            left: 0;
            z-index: 30; /* Must be on top of all other headers */
        }

        /* Ensure numbers in the table are aligned */
        #sensitivity-table td, #sensitivity-table th {
            font-variant-numeric: tabular-nums;
            padding: 0.5rem 0.25rem; /* Further reduced horizontal padding */
            border: 1px solid #e2e8f0;
            text-align: right;
            min-width: 80px; /* Further reduced min-width */
        }
        
        #sensitivity-table tbody th {
            min-width: 100px; /* Further reduced min-width for home prices */
        }

        /* Highlighting for Today's Rate Column */
        .today-rate {
            border-left: 2px solid #d97706 !important; /* Amber-600 */
            border-right: 2px solid #d97706 !important;
            position: relative;
        }
        /* Label for the header */
        thead th.today-rate::after {
            content: ' (Avg)';
            display: block;
            font-size: 0.7rem;
            color: #d97706;
            font-weight: 700;
            line-height: 1;
            margin-top: 2px;
        }

        /* Form input styling */
        .form-input, .form-select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            box-shadow: inset 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        
        .form-label {
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 0.875rem; /* text-sm */
            margin-bottom: 0.25rem;
        }

        /* Tooltip Styles */
        .tooltip {
            position: relative;
            display: inline-flex;
            cursor: help;
            margin-left: 6px;
        }
        .tooltip .tooltip-text {
            visibility: hidden;
            width: 240px;
            background-color: #1e293b;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 10px 14px;
            position: absolute;
            z-index: 50;
            bottom: 135%;
            left: 50%;
            margin-left: -120px; /* Center the tooltip */
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.75rem;
            font-weight: normal;
            line-height: 1.4;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        /* Tooltip arrow */
        .tooltip .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }
        /* Tooltip icon color */
        .tooltip svg {
            color: #94a3b8; /* Slate-400 */
            transition: color 0.2s;
        }
        .tooltip:hover svg {
            color: #475569; /* Slate-600 */
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="container max-w-screen-xl mx-auto p-4 md:p-8">
        
        <!-- UPDATED HEADER SECTION -->
        <header class="mb-6 flex items-center gap-4">
            <!-- Logo: Added bg-gray-100 and p-2 for matching background and slight padding -->
            <img src="assets/logo.jpg" alt="Company Logo" class="h-16 w-auto flex-shrink-0 bg-gray-100 p-2 rounded-lg" 
                 onerror="this.style.display='none'; console.warn('Logo not found at assets/logo.jpg')">
            
            <!-- Title Container -->
            <div>
                <h1 class="text-3xl font-bold text-gray-800 leading-tight">Mortgage Sensitivity Analysis</h1>
                <p class="text-lg text-gray-600 leading-tight mt-1">See how your monthly payment changes with home price and interest rate.</p>
            </div>
        </header>
        <!-- END UPDATED HEADER SECTION -->

        <!-- Section for constant inputs -->
        <div id="inputs" class="bg-white p-4 md:p-6 rounded-lg shadow-md mb-6">
            <form id="calc-form">
                <!-- Updated grid layout -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                    
                    <!-- Available Funds -->
                    <div>
                        <label for="availableFunds" class="form-label">
                            Available Funds ($)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    Total cash you have on hand for closing. This helps calculate how much you'll have left after the down payment.
                                </span>
                            </div>
                        </label>
                        <input type="text" inputmode="decimal" id="availableFunds" class="form-input" value="100000">
                    </div>

                    <!-- Down Payment Value (Simplified) -->
                    <div>
                        <label for="downPaymentValue" class="form-label">
                            Down Payment ($)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    The exact dollar amount you plan to pay upfront for the home.
                                </span>
                            </div>
                        </label>
                        <input type="text" inputmode="decimal" id="downPaymentValue" class="form-input" value="50000">
                    </div>

                    <!-- Remaining Funds (Display) -->
                    <div>
                        <label class="form-label">
                            Remaining Funds ($)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    Cash left over after paying the down payment. Useful for closing costs, moving expenses, or reserves.
                                </span>
                            </div>
                        </label>
                        <div id="remainingFunds" class="form-input bg-gray-100 text-gray-700 h-[38px] flex items-center">
                            N/A
                        </div>
                    </div>

                    <!-- Loan Term -->
                    <div>
                        <label for="loanTerm" class="form-label">
                            Loan Term (Years)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    The length of your mortgage. 30 years is standard, but 15 or 20 years are also common options.
                                </span>
                            </div>
                        </label>
                        <input type="number" id="loanTerm" class="form-input" value="30">
                    </div>

                    <!-- Today's National Avg Rate -->
                    <div>
                        <label for="todayRate" class="form-label text-amber-700">
                            Today's National Avg (%)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-amber-600">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    Enter the current 30-year fixed rate here. This column will be highlighted in gold in the table below so you can compare other rates against today's national average.
                                </span>
                            </div>
                        </label>
                        <input type="number" id="todayRate" class="form-input border-amber-300 bg-amber-50 font-semibold" step="0.01" value="6.22">
                        <p class="text-xs text-gray-500 mt-1">
                            Source: <a href="https://www.freddiemac.com/pmms" target="_blank" rel="noopener noreferrer" class="underline hover:text-amber-700 transition-colors">Freddie Mac PMMS</a>
                        </p>
                    </div>

                    <!-- Start Rate -->
                    <div>
                        <label for="startRate" class="form-label">
                            Start Rate (%)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    The lowest interest rate you want to see in the comparison table.
                                </span>
                            </div>
                        </label>
                        <input type="number" id="startRate" class="form-input" step="0.1" value="3.0">
                    </div>

                    <!-- End Rate -->
                    <div>
                        <label for="endRate" class="form-label">
                            End Rate (%)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    The highest interest rate you want to see in the comparison table.
                                </span>
                            </div>
                        </label>
                        <input type="number" id="endRate" class="form-input" step="0.1" value="8.0">
                    </div>

                    <!-- Rate Increment -->
                    <div>
                        <label for="rateIncrement" class="form-label">
                            Rate Increment (%)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    How much to increase the rate for each new column in the table (e.g., 0.5 means columns for 3.0%, 3.5%, 4.0%, etc.).
                                </span>
                            </div>
                        </label>
                        <input type="number" id="rateIncrement" class="form-input" step="0.1" value="0.5">
                    </div>

                    <!-- Property Tax Rate -->
                    <div>
                        <label for="taxRate" class="form-label">
                            Annual Tax Rate (%)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    Estimated annual property tax as a percentage of the home price. The national average is around 1.1%, but it varies by location.
                                </span>
                            </div>
                        </label>
                        <input type="number" id="taxRate" class="form-input" step="0.1" value="2.1">
                    </div>

                    <!-- Homeowners Insurance -->
                    <div>
                        <label for="insurance" class="form-label">
                            Annual Insurance ($)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    Estimated yearly cost for homeowners insurance.
                                </span>
                            </div>
                        </label>
                        <input type="number" id="insurance" class="form-input" step="100" value="2200">
                    </div>

                    <!-- HOA Dues -->
                    <div>
                        <label for="hoa" class="form-label">
                            Monthly HOA ($)
                            <div class="tooltip">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="tooltip-text">
                                    Monthly Homeowners Association fees, if applicable to the property.
                                </span>
                            </div>
                        </label>
                        <input type="number" id="hoa" class="form-input" step="10" value="50">
                    </div>
                </div>

                <!-- Generate Button -->
                <button type="button" id="generateBtn" class="w-full lg:w-auto mt-6 bg-blue-600 text-white font-bold py-2 px-6 rounded-lg shadow hover:bg-blue-700 transition-colors duration-200">
                    Generate Table
                </button>
            </form>
        </div>

        <!-- Container for the dynamically generated table -->
        <div id="table-container">
            <!-- JavaScript will render the table here -->
            <p class="p-8 text-center text-gray-500">Click "Generate Table" to see your results.</p>
        </div>

    </div>

    <script>
        // --- DOM Element References ---
        const generateBtn = document.getElementById('generateBtn');
        const tableContainer = document.getElementById('table-container');
        
        // Input Fields
        const downPaymentValueEl = document.getElementById('downPaymentValue');
        const availableFundsEl = document.getElementById('availableFunds');
        const remainingFundsEl = document.getElementById('remainingFunds');
        const loanTermEl = document.getElementById('loanTerm');
        const taxRateEl = document.getElementById('taxRate');
        const insuranceEl = document.getElementById('insurance');
        const hoaEl = document.getElementById('hoa');
        
        // Rate fields
        const todayRateEl = document.getElementById('todayRate'); 
        const startRateEl = document.getElementById('startRate');
        const endRateEl = document.getElementById('endRate');
        const rateIncrementEl = document.getElementById('rateIncrement');

        // --- Event Listeners ---
        generateBtn.addEventListener('click', generateTable);

        // Add listeners to update remaining funds
        availableFundsEl.addEventListener('input', updateRemainingFunds);
        downPaymentValueEl.addEventListener('input', updateRemainingFunds);

        // Currency formatting listeners
        availableFundsEl.addEventListener('focus', unformatInputForEditing);
        availableFundsEl.addEventListener('blur', formatInputAsCurrency);
        downPaymentValueEl.addEventListener('focus', unformatInputForEditing);
        downPaymentValueEl.addEventListener('blur', formatInputAsCurrency);

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            availableFundsEl.value = formatCurrency(parseCurrency(availableFundsEl.value));
            downPaymentValueEl.value = formatCurrency(parseCurrency(downPaymentValueEl.value));
            updateRemainingFunds();
            generateBtn.click();
        });
        
        // --- Helper Functions ---

        function parseCurrency(value) {
            if (typeof value === 'number') return value;
            return parseFloat(String(value).replace(/[$,]/g, '')) || 0;
        }

        function formatInputAsCurrency(e) {
            const input = e.target;
            const value = parseCurrency(input.value);
            input.value = formatCurrency(value);
        }

        function unformatInputForEditing(e) {
            const input = e.target;
            const value = parseCurrency(input.value);
            input.value = value === 0 ? '' : value;
        }

        function updateRemainingFunds() {
            const available = parseCurrency(availableFundsEl.value) || 0;
            const downPayment = parseCurrency(downPaymentValueEl.value) || 0;
            remainingFundsEl.textContent = formatCurrency(available - downPayment);
        }

        // --- Core Table Generation ---
        function generateTable() {
            const downPaymentValue = parseCurrency(downPaymentValueEl.value) || 0;
            const loanTermYears = parseFloat(loanTermEl.value) || 30;
            const taxRate = parseFloat(taxRateEl.value) || 0;
            const annualInsurance = parseFloat(insuranceEl.value) || 0;
            const monthlyHoa = parseFloat(hoaEl.value) || 0;

            // Rate Inputs
            const todayRate = parseFloat(todayRateEl.value) || 0;
            const startRate = parseFloat(startRateEl.value) || 3.0;
            const endRate = parseFloat(endRateEl.value) || 8.0;
            const rateIncrement = parseFloat(rateIncrementEl.value) || 0.5;

            if (rateIncrement <= 0) {
                tableContainer.innerHTML = '<p class="p-8 text-center text-red-600">Rate Increment must be greater than 0.</p>';
                return;
            }

            // Generate base interest rates
            let interestRates = [];
            for (let rate = startRate; rate <= endRate + 0.001; rate += rateIncrement) {
                interestRates.push(parseFloat(rate.toFixed(2)));
            }

            // Inject Today's Rate if it's valid and not already there
            if (todayRate > 0 && !interestRates.includes(todayRate)) {
                interestRates.push(todayRate);
            }

            // Sort numerically
            interestRates.sort((a, b) => a - b);

            const homePrices = [];
            for (let price = 50000; price <= 2000000; price += 25000) {
                homePrices.push(price);
            }

            // --- Table Generation (2-Pass for Heatmap) ---
            let tableData = [];
            let minPayment = Infinity;
            let maxPayment = -Infinity;

            // Pass 1: Calculate all payments
            for (const price of homePrices) {
                let rowData = [];
                for (const rate of interestRates) {
                    const payment = calculateMonthlyPayment(price, downPaymentValue, rate, loanTermYears, taxRate, annualInsurance, monthlyHoa);
                    rowData.push(payment);
                    if (payment < minPayment) minPayment = payment;
                    if (payment > maxPayment) maxPayment = payment;
                }
                tableData.push(rowData);
            }

            // Pass 2: Render HTML
             let html = '<table id="sensitivity-table" class="w-full border-collapse text-sm">';
             html += '<thead><tr><th class="sticky top-0 left-0 z-30 bg-gray-200">Home Price</th>';
             for (const rate of interestRates) {
                 const isToday = (rate === todayRate);
                 html += `<th class="sticky top-0 z-10 bg-gray-200${isToday ? ' today-rate' : ''}">${rate.toFixed(2)}%</th>`;
             }
             html += '</tr></thead><tbody>';

             for (let i = 0; i < homePrices.length; i++) {
                 html += '<tr>';
                 html += `<th class="sticky left-0 z-20 bg-gray-200">${formatCurrency(homePrices[i])}</th>`;
                 for (let j = 0; j < interestRates.length; j++) {
                     const isToday = (interestRates[j] === todayRate);
                     const color = getHeatmapColor(tableData[i][j], minPayment, maxPayment);
                     html += `<td style="background-color: ${color};" ${isToday ? 'class="today-rate"' : ''}>${formatCurrency(tableData[i][j])}</td>`;
                 }
                 html += '</tr>';
             }
             html += '</tbody></table>';

            tableContainer.innerHTML = html;
        }

        function calculateMonthlyPayment(homePrice, downPayment, interestRate, loanTerm, taxRate, insurance, hoa) {
            let loanAmount = Math.max(0, homePrice - downPayment);
            const monthlyRate = (interestRate / 100) / 12;
            const numPayments = loanTerm * 12;
            let pAndI = 0;

            if (loanAmount > 0) {
                if (monthlyRate > 0) {
                    pAndI = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) / (Math.pow(1 + monthlyRate, numPayments) - 1);
                } else {
                    pAndI = loanAmount / numPayments;
                }
            }

            return pAndI + ((homePrice * taxRate / 100) / 12) + (insurance / 12) + hoa;
        }

        function getHeatmapColor(value, min, max) {
            if (min === max) return 'hsl(120, 90%, 85%)';
            const percent = (value - min) / (max - min);
            const hue = 120 * (1 - percent);
            return `hsl(${hue}, 90%, 85%)`;
        }

        function formatCurrency(value) {
            return value.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0, minimumFractionDigits: 0 });
        }
    </script>
</body>
</html>
